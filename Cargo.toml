[package]
name = "iterascope"
version = "0.1.0"
edition = "2024"
description = "IteraScope — an open laboratory for complex dynamics"
license = "MIT"
repository = "https://github.com/thepacket/iterascope"

[[bin]]
name = "iterascope"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.0"
rfd = "0.15.4"
dashu-float = "0.5.0"
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "web_screen_reader",
    "wgpu",
] }
egui = "0.35.0"
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
futures-channel = "0.3.31"
js-sys = "0.3.103"
mp4 = "0.14"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Navigator",
    "Url",
    "Window",
] }
zip = { version = "8.6.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[dev-dependencies]
# Deliberately pinned to the Naga release used by wgpu 29.
naga = { version = "29.0.4", features = ["wgsl-in"] }
pollster = "0.4.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
