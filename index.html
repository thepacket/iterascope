<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>IteraScope</title>
    <meta name="description" content="IteraScope — an open laboratory for complex dynamics." />
    <meta name="color-scheme" content="dark" />
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0d12;
            color: #c8ccd4;
            font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #iterascope_loading {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 8px;
            text-align: center;
            color: #8d94a1;
        }
        #iterascope_loading .brand {
            color: #e6e9ef;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.08em;
        }
        #iterascope_loading .error { color: #ff8a80; max-width: 52ch; }
    </style>
</head>
<body>
    <canvas id="iterascope_canvas"></canvas>
    <div id="iterascope_loading">
        <div class="brand">ITERASCOPE</div>
        <div>preparing the complex plane…</div>
    </div>
</body>
</html>
